<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>병아리 블록 가계부</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

<!-- ★ 코드에서 문자열로 참조되는 자산 (components.jsx + screens.jsx) -->
<meta name="ext-resource-dependency" content="assets/chick_save.png"     data-resource-id="chickSave" />
<meta name="ext-resource-dependency" content="assets/chick_spend.png"    data-resource-id="chickSpend" />
<meta name="ext-resource-dependency" content="assets/chick_ghost.png"    data-resource-id="chickGhost" />
<meta name="ext-resource-dependency" content="assets/chick_spend_nu.png" data-resource-id="chickSpendNu" />
<meta name="ext-resource-dependency" content="assets/chick_ghost_nu.png" data-resource-id="chickGhostNu" />
<meta name="ext-resource-dependency" content="assets/chick_day.png"      data-resource-id="chickDay" />
<meta name="ext-resource-dependency" content="assets/chick_night.png"    data-resource-id="chickNight" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<template id="__bundler_thumbnail" data-bg-color="#0B1130">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0B1130"/>
    <!-- phone outline -->
    <rect x="430" y="80" width="340" height="640" rx="56" fill="#0E1638" stroke="#36417C" stroke-width="3"/>
    <!-- notch -->
    <rect x="555" y="100" width="90" height="24" rx="12" fill="#000"/>
    <!-- mini board -->
    <rect x="495" y="230" width="210" height="320" rx="14" fill="#070C25" stroke="#5B6CA8" stroke-width="2"/>
    <!-- stacked blocks (yellow saving base + colorful spend) -->
    <g>
      <rect x="505" y="500" width="40" height="40" rx="6" fill="#FFE899" stroke="#E5C04F" stroke-width="2"/>
      <rect x="551" y="500" width="40" height="40" rx="6" fill="#FFE899" stroke="#E5C04F" stroke-width="2"/>
      <rect x="597" y="500" width="40" height="40" rx="6" fill="#FFE899" stroke="#E5C04F" stroke-width="2"/>
      <rect x="643" y="500" width="40" height="40" rx="6" fill="#FFE899" stroke="#E5C04F" stroke-width="2"/>
      <rect x="505" y="454" width="40" height="40" rx="6" fill="#FFA7AF" stroke="#E54C5A" stroke-width="2"/>
      <rect x="597" y="454" width="40" height="40" rx="6" fill="#FFA7AF" stroke="#E54C5A" stroke-width="2"/>
      <rect x="643" y="454" width="40" height="40" rx="6" fill="#B7C9FF" stroke="#6E96FF" stroke-width="2"/>
    </g>
    <!-- goal line -->
    <line x1="495" y1="380" x2="705" y2="380" stroke="#FFA7AF" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- chick face glyph -->
    <g transform="translate(600 305)">
      <circle r="38" fill="#FFE899" stroke="#C99A2B" stroke-width="3"/>
      <ellipse cx="-12" cy="-4" rx="4" ry="6" fill="#3A2A0A"/>
      <ellipse cx="12" cy="-4" rx="4" ry="6" fill="#3A2A0A"/>
      <ellipse cx="0" cy="12" rx="10" ry="7" fill="#FFA94D" stroke="#C2761A" stroke-width="2"/>
    </g>
    <!-- moon (night mode hint) top-right -->
    <g transform="translate(740 200)">
      <circle r="18" fill="#FFE899" opacity="0.85"/>
      <circle r="18" cx="6" cy="-3" fill="#0E1638"/>
    </g>
    <!-- title -->
    <text x="600" y="760" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#F4F6FF">병아리 블록 가계부</text>
  </svg>
</template>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react" src="ios-frame.jsx"></script>
<script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
<script type="text/babel" data-presets="react" src="game-data.jsx"></script>
<script type="text/babel" data-presets="react" src="components.jsx"></script>
<script type="text/babel" data-presets="react" src="screens.jsx"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
