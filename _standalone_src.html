<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>병아리 테트리스 가계부</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="ext-resource-dependency" content="assets/chick_save.png"  data-resource-id="chickSave" />
<meta name="ext-resource-dependency" content="assets/chick_spend.png" data-resource-id="chickSpend" />
<meta name="ext-resource-dependency" content="assets/chick_ghost.png" data-resource-id="chickGhost" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0E1638">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0E1638"/>
    <!-- phone outline -->
    <rect x="430" y="100" width="340" height="600" rx="56" fill="#0B1335" stroke="#36417C" stroke-width="3"/>
    <!-- notch -->
    <rect x="555" y="120" width="90" height="24" rx="12" fill="#000"/>
    <!-- mini board -->
    <rect x="500" y="240" width="200" height="280" rx="14" fill="#070C25" stroke="#5B6CA8" stroke-width="2"/>
    <!-- chick blocks: yellow stack at bottom -->
    <g>
      <rect x="510" y="470" width="36" height="36" rx="6" fill="#FFE899" stroke="#E5C04F" stroke-width="2"/>
      <rect x="552" y="470" width="36" height="36" rx="6" fill="#FFE899" stroke="#E5C04F" stroke-width="2"/>
      <rect x="594" y="470" width="36" height="36" rx="6" fill="#FFE899" stroke="#E5C04F" stroke-width="2"/>
      <rect x="636" y="470" width="36" height="36" rx="6" fill="#FFE899" stroke="#E5C04F" stroke-width="2"/>
      <!-- red spend on top with gap -->
      <rect x="510" y="428" width="36" height="36" rx="6" fill="#FFA7AF" stroke="#E54C5A" stroke-width="2"/>
      <rect x="594" y="428" width="36" height="36" rx="6" fill="#FFA7AF" stroke="#E54C5A" stroke-width="2"/>
      <rect x="636" y="428" width="36" height="36" rx="6" fill="#B7C9FF" stroke="#6E96FF" stroke-width="2"/>
    </g>
    <!-- goal line -->
    <line x1="500" y1="360" x2="700" y2="360" stroke="#FFA7AF" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- chick face glyph -->
    <g transform="translate(600 290)">
      <circle r="34" fill="#FFE899" stroke="#C99A2B" stroke-width="3"/>
      <ellipse cx="-11" cy="-3" rx="3.5" ry="5" fill="#3A2A0A"/>
      <ellipse cx="11" cy="-3" rx="3.5" ry="5" fill="#3A2A0A"/>
      <ellipse cx="0" cy="10" rx="9" ry="6" fill="#FFA94D" stroke="#C2761A" stroke-width="2"/>
    </g>
    <!-- title -->
    <text x="600" y="740" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#F4F6FF">병아리 테트리스 가계부</text>
  </svg>
</template>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react" src="ios-frame.jsx"></script>
<script type="text/babel" data-presets="react" src="game-data.jsx"></script>
<script type="text/babel" data-presets="react" src="_standalone_components.jsx"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
